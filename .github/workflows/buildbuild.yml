name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 1️⃣ Cài tạm Gradle CLI (chỉ để tạo wrapper)
      - name: Install Gradle CLI
        run: sudo apt-get update && sudo apt-get install -y gradle

      # 2️⃣ Tạo wrapper mới trong repo (Gradle 8.7 — ổn định với Android)
      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7

      # 3️⃣ Cho phép chạy script
      - name: Make gradlew executable
        run: chmod +x gradlew

      # 4️⃣ Build APK
      - name: Build debug APK
        run: ./gradlew assembleDebug

      # 5️⃣ Upload kết quả để tải về
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
